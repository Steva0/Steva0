name: Update README and Deploy CV Pages

on:
  push:
    paths:
      - 'cv_url.txt'
  workflow_dispatch:

# Permessi necessari per aggiornare il codice e pubblicare le Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-readme-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README inline and build site
        run: |
          # 1. Legge l'URL dal file cv_url.txt
          CV_URL=$(tr -d '\r\n' < cv_url.txt)

          # 2. Aggiorna il link inline nel README.md
          NEW_LINK="[Visualizza il mio CV](${CV_URL})"
          python3 -c "
          import re
          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()
          pattern = r'(<!-- CV_LINK_START -->).*?(<!-- CV_LINK_END -->)'
          replacement = r'\g<1>' + '${NEW_LINK}' + r'\g<2>'
          new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(new_content)
          "

          # 3. Crea la cartella del sito con il redirect per GitHub Pages
          mkdir -p public
          cat <<EOF > public/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=${CV_URL}">
              <script>window.location.replace("${CV_URL}");</script>
              <title>Redirecting to CV...</title>
            </head>
            <body>
              <p>Reindirizzamento al curriculum in corso... <a href="${CV_URL}">Clicca qui se non vieni reindirizzato</a>.</p>
            </body>
          </html>
          EOF

      - name: Commit and push README changes (as Steva0)
        run: |
          # Imposta la tua identità per non far comparire bot
          git config --global user.name "Steva0"
          git config --global user.email "steva0@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "Nessuna modifica rilevata nel README."
          else
            git commit -m "Update CV link in README.md"
            git push
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-readme-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
